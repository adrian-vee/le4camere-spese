<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — Le 4 Camere</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Albert Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #FAF9F5; color: #1F3326; display: flex; align-items: center;
      justify-content: center; min-height: 100vh; padding: 24px; text-align: center;
    }
    .container { max-width: 380px; }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 { font-family: Georgia, serif; font-size: 24px; margin-bottom: 12px; }
    p { font-size: 15px; color: #6C6B5D; line-height: 1.6; margin-bottom: 24px; }
    button {
      background: #1F3326; color: #FAF9F5; border: none; border-radius: 8px;
      padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer;
      font-family: inherit;
    }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Sei offline</h1>
    <p>Riconnettiti a internet per usare il gestionale Le 4 Camere.</p>
    <button onclick="location.reload()">Riprova</button>
  </div>
</body>
</html>
